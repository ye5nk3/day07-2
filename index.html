<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>냉장고 레시피</title>
<style>
  :root {
    --bg: #fafaf7; --card: #fff; --text: #222; --muted: #6b6b6b;
    --line: #e2e2dc; --accent: #2f8f5b; --accent-text: #fff;
    --chip: #e8f4ed; --danger: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151816; --card: #1f2321; --text: #eee; --muted: #a0a6a2;
      --line: #333a36; --accent: #4cbb81; --accent-text: #0e1511;
      --chip: #24352b; --danger: #ff7b6b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    line-height: 1.5;
  }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.4rem; margin: 8px 0 16px; }
  h2 { font-size: 1.05rem; margin: 0 0 12px; }
  section {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px; margin-bottom: 16px;
  }
  button {
    font: inherit; border: 0; border-radius: 8px; padding: 10px 16px;
    background: var(--accent); color: var(--accent-text); cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--line); }
  #drop {
    border: 2px dashed var(--line); border-radius: 10px; padding: 24px 12px;
    text-align: center; color: var(--muted); cursor: pointer;
  }
  #drop.over { border-color: var(--accent); }
  #preview { display: none; width: 100%; max-height: 320px; object-fit: contain; border-radius: 8px; margin-top: 12px; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  .row input {
    flex: 1; min-width: 0; font: inherit; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text);
  }
  #chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; min-height: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--chip); border-radius: 999px; padding: 4px 6px 4px 12px;
  }
  .chip button {
    background: transparent; color: var(--muted); padding: 0 6px; font-size: 1.1rem; line-height: 1.4;
  }
  #status { margin-top: 12px; color: var(--muted); min-height: 1.5em; }
  #status.error { color: var(--danger); }
  .spinner {
    display: inline-block; width: 14px; height: 14px; margin-right: 6px; vertical-align: -2px;
    border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .recipe { border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-top: 12px; }
  .recipe h3 { margin: 0 0 4px; font-size: 1.05rem; }
  .recipe p { margin: 0 0 8px; color: var(--muted); }
  .meta { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; color: var(--muted); font-size: .9rem; }
  .badge { background: var(--chip); border-radius: 999px; padding: 2px 10px; color: var(--text); }
  .recipe h4 { margin: 12px 0 4px; font-size: .95rem; }
  .recipe ul, .recipe ol { margin: 0; padding-left: 20px; }
  .recipe li.need { color: var(--danger); font-weight: 600; }
  .recipe li .tag { font-size: .8rem; font-weight: 400; margin-left: 4px; }
  .recipe .actions { margin-top: 12px; display: flex; gap: 8px; }
  #profileBar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; color: var(--muted); }
  #profileBar strong { color: var(--text); }
  #profileBar button { padding: 4px 10px; }
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text); padding: 20px; width: min(360px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog p { margin: 0 0 4px; }
  dialog .row { margin-top: 12px; }
  #dialogError { color: var(--danger); min-height: 1.5em; margin-top: 8px; }
  details.recipe > summary { cursor: pointer; font-weight: 600; }
  details.recipe > summary small { font-weight: 400; color: var(--muted); margin-left: 6px; }
  button.danger { color: var(--danger); border-color: var(--danger); }
</style>
</head>
<body>
<main>
  <h1>🧊 냉장고 레시피</h1>
  <div id="profileBar">
    <span id="profileLabel"></span>
    <button id="profileBtn" class="secondary" type="button">프로필 입력</button>
  </div>

  <section id="step1">
    <h2>① 사진 · 재료</h2>
    <div id="drop" tabindex="0" role="button" aria-label="냉장고 사진 선택">
      사진을 끌어다 놓거나 눌러서 선택하세요
    </div>
    <input id="file" type="file" accept="image/*" hidden>
    <img id="preview" alt="선택한 사진 미리보기">
    <div class="row">
      <button id="detect" disabled>재료 인식</button>
    </div>
    <div id="status" aria-live="polite"></div>

    <div id="chips" aria-label="인식된 재료"></div>
    <form class="row" id="addForm">
      <input id="addInput" maxlength="30" placeholder="재료 직접 추가" aria-label="재료 직접 추가">
      <button type="submit" class="secondary">추가</button>
    </form>
  </section>

  <section id="step2">
    <h2>② 레시피 추천</h2>
    <button id="recommend" disabled>레시피 추천받기</button>
    <div id="status2" aria-live="polite"></div>
    <div id="recipes"></div>
  </section>

  <section id="step3">
    <h2>③ 내 레시피</h2>
    <div id="status3" aria-live="polite"></div>
    <div id="saved"></div>
  </section>
</main>

<dialog id="profileDialog" aria-labelledby="dialogTitle">
  <form id="profileForm" method="dialog">
    <p id="dialogTitle"><strong>이름을 입력해 주세요</strong></p>
    <p style="color: var(--muted); font-size: .9rem;">같은 이름으로 다시 들어오면 저장한 레시피를 볼 수 있어요. 비밀번호가 없으니 민감한 정보는 쓰지 마세요.</p>
    <div class="row">
      <input id="nameInput" maxlength="20" placeholder="이름 (1~20자)" aria-label="이름" autocomplete="off">
    </div>
    <div id="dialogError" aria-live="polite"></div>
    <div class="row">
      <button type="submit" id="nameSubmit">확인</button>
      <button type="button" id="nameCancel" class="secondary">취소</button>
    </div>
  </form>
</dialog>

<script>
// 공개 가능한 값만 둡니다 (service_role 키 금지).
const SUPABASE_URL = "https://bkebbwsfwcnrrhbkrtyt.supabase.co";
const SUPABASE_KEY = "sb_publishable_7gPnaBYMNoPONKPkaYI6tw_9CwgTQDd"; // 공개용(publishable) 키
const MAX_INGREDIENTS = 40;
const MAX_SIDE = 1024;

const $ = (id) => document.getElementById(id);
const els = {
  drop: $("drop"), file: $("file"), preview: $("preview"), detect: $("detect"),
  status: $("status"), chips: $("chips"), addForm: $("addForm"), addInput: $("addInput"),
  recommend: $("recommend"), status2: $("status2"), recipes: $("recipes"),
};
let busy2 = false;

let imageData = null;      // 리사이즈된 data URL
let ingredients = [];      // 현재 재료 목록
let edited = false;        // 인식 이후 사용자가 직접 편집했는지
let busy = false;

function setStatus(msg, { error = false, loading = false } = {}) {
  els.status.className = error ? "error" : "";
  els.status.textContent = "";
  if (loading) {
    const sp = document.createElement("span");
    sp.className = "spinner";
    els.status.appendChild(sp);
  }
  els.status.appendChild(document.createTextNode(msg));
}

function renderChips() {
  els.chips.textContent = "";
  ingredients.forEach((name, i) => {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.appendChild(document.createTextNode(name));
    const x = document.createElement("button");
    x.type = "button";
    x.textContent = "✕";
    x.setAttribute("aria-label", name + " 삭제");
    x.addEventListener("click", () => {
      ingredients.splice(i, 1);
      edited = true;
      renderChips();
    });
    chip.appendChild(x);
    els.chips.appendChild(chip);
  });
  els.recommend.disabled = busy2 || ingredients.length === 0;
}

function addIngredient(raw) {
  const name = raw.trim().replace(/\s+/g, " ");
  if (!name) return;
  if (ingredients.includes(name)) { setStatus("이미 있는 재료입니다.", { error: true }); return; }
  if (ingredients.length >= MAX_INGREDIENTS) { setStatus(`재료는 최대 ${MAX_INGREDIENTS}개까지 가능합니다.`, { error: true }); return; }
  ingredients.push(name);
  edited = true;
  setStatus("");
  renderChips();
}

function resizeToJpeg(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, MAX_SIDE / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
    img.src = url;
  });
}

async function handleFile(file) {
  if (!file || !file.type.startsWith("image/")) { setStatus("이미지 파일을 선택해 주세요.", { error: true }); return; }
  if (edited && !confirm("직접 편집한 재료 목록이 초기화됩니다. 계속할까요?")) return;
  try {
    imageData = await resizeToJpeg(file);
  } catch {
    setStatus("이미지를 읽지 못했습니다. 다른 사진을 선택해 주세요.", { error: true });
    return;
  }
  els.preview.src = imageData;
  els.preview.style.display = "block";
  ingredients = [];
  edited = false;
  renderChips();
  setStatus("");
  els.detect.disabled = false;
}

async function detect() {
  if (busy || !imageData) return;
  busy = true;
  els.detect.disabled = true;
  setStatus("재료를 인식하는 중입니다...", { loading: true });
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 60000);
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/detect-ingredients`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image: imageData }),
      signal: ctrl.signal,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "재료 인식에 실패했습니다.");
    ingredients = data.ingredients || [];
    edited = false;
    renderChips();
    setStatus(ingredients.length
      ? `${ingredients.length}개 재료를 찾았습니다. 빼거나 더해 주세요.`
      : "재료를 찾지 못했어요. 직접 추가해 주세요.");
  } catch (e) {
    const msg = e.name === "AbortError" ? "응답이 너무 오래 걸립니다. 다시 시도해 주세요."
      : e instanceof TypeError ? "네트워크 연결을 확인해 주세요."
      : e.message;
    setStatus(msg, { error: true });
  } finally {
    clearTimeout(timer);
    busy = false;
    els.detect.disabled = !imageData;
  }
}

function setStatus2(msg, { error = false, loading = false } = {}) {
  els.status2.className = error ? "error" : "";
  els.status2.style.marginTop = "12px";
  els.status2.textContent = "";
  if (loading) {
    const sp = document.createElement("span");
    sp.className = "spinner";
    els.status2.appendChild(sp);
  }
  els.status2.appendChild(document.createTextNode(msg));
}

function el(tag, text, cls) {
  const n = document.createElement(tag);
  if (text != null) n.textContent = text;
  if (cls) n.className = cls;
  return n;
}

// 카드 본문(요약·재료·순서)을 container에 채웁니다. 모든 문자열은 textContent로만 넣습니다.
function fillRecipeBody(container, r) {
  container.appendChild(el("p", r.summary || ""));

  const meta = el("div", null, "meta");
  meta.appendChild(el("span", r.cook_time_min ? `⏱ ${r.cook_time_min}분` : ""));
  if (r.difficulty) meta.appendChild(el("span", r.difficulty, "badge"));
  container.appendChild(meta);

  container.appendChild(el("h4", "재료"));
  const ul = el("ul");
  (r.ingredients || []).forEach((i) => {
    const li = el("li", i.amount ? `${i.name} ${i.amount}` : i.name, i.have ? "" : "need");
    if (!i.have) li.appendChild(el("span", "추가 필요", "tag"));
    ul.appendChild(li);
  });
  container.appendChild(ul);

  container.appendChild(el("h4", "조리 순서"));
  const ol = el("ol");
  (r.steps || []).forEach((s) => ol.appendChild(el("li", s)));
  container.appendChild(ol);
}

function renderRecipes(list) {
  els.recipes.textContent = "";
  list.forEach((r) => {
    const card = el("article", null, "recipe");
    card.appendChild(el("h3", r.title));
    fillRecipeBody(card, r);

    const actions = el("div", null, "actions");
    const save = el("button", "저장", "secondary");
    save.addEventListener("click", () => saveRecipe(r, save));
    actions.appendChild(save);
    card.appendChild(actions);

    els.recipes.appendChild(card);
  });
}

// ---------- 3단계: 프로필 · 저장 · 조회 ----------
const REST = `${SUPABASE_URL}/rest/v1`;
const dbHeaders = { apikey: SUPABASE_KEY, "Content-Type": "application/json" };

async function db(path, { method = "GET", body, returning = false } = {}) {
  const headers = { ...dbHeaders };
  if (returning) headers.Prefer = "return=representation";
  const res = await fetch(`${REST}/${path}`, { method, headers, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => null);
  if (!res.ok) {
    const err = new Error((data && data.message) || "데이터베이스 요청에 실패했습니다.");
    err.status = res.status;
    throw err;
  }
  return data;
}

let profile = null;   // { id, name }

function loadStoredProfile() {
  try {
    const id = localStorage.getItem("profile_id");
    const name = localStorage.getItem("profile_name");
    if (id && name) profile = { id, name };
  } catch { /* 저장소를 못 쓰는 환경이면 무시 */ }
}
function storeProfile() {
  try {
    if (profile) { localStorage.setItem("profile_id", profile.id); localStorage.setItem("profile_name", profile.name); }
    else { localStorage.removeItem("profile_id"); localStorage.removeItem("profile_name"); }
  } catch { /* 무시 */ }
}

function normalizeName(raw) { return raw.trim().replace(/\s+/g, " "); }

async function findOrCreateProfile(name) {
  const find = async () => {
    const rows = await db(`profiles?name=eq.${encodeURIComponent(name)}&select=id,name`);
    return rows[0] || null;
  };
  let p = await find();
  if (p) return p;
  try {
    const rows = await db("profiles", { method: "POST", body: { name }, returning: true });
    return { id: rows[0].id, name: rows[0].name };
  } catch (e) {
    if (e.status === 409) { p = await find(); if (p) return p; }   // 동시에 만들어진 경우
    throw e;
  }
}

function renderProfileBar() {
  $("profileLabel").textContent = "";
  if (profile) {
    $("profileLabel").appendChild(document.createTextNode("프로필: "));
    $("profileLabel").appendChild(el("strong", profile.name));
    $("profileBtn").textContent = "변경";
  } else {
    $("profileLabel").textContent = "프로필 없음";
    $("profileBtn").textContent = "프로필 입력";
  }
}

// 이름 입력 창을 열고, 프로필이 정해지면 그 값을, 취소하면 null을 돌려줍니다.
function askProfile() {
  return new Promise((resolve) => {
    const dlg = $("profileDialog");
    const input = $("nameInput");
    const errBox = $("dialogError");
    const form = $("profileForm");
    let done = false;
    errBox.textContent = "";
    input.value = "";

    const finish = (value) => {
      if (done) return;
      done = true;
      form.removeEventListener("submit", onSubmit);
      $("nameCancel").removeEventListener("click", onCancel);
      dlg.removeEventListener("close", onCancel);
      if (dlg.open) dlg.close();
      resolve(value);
    };
    const onCancel = () => finish(null);
    const onSubmit = async (e) => {
      e.preventDefault();
      const name = normalizeName(input.value);
      const len = [...name].length;
      if (len < 1 || len > 20) { errBox.textContent = "이름은 1~20자로 입력해 주세요."; return; }
      $("nameSubmit").disabled = true;
      errBox.textContent = "";
      try {
        const p = await findOrCreateProfile(name);
        profile = p;
        storeProfile();
        renderProfileBar();
        finish(p);
      } catch (err) {
        errBox.textContent = err instanceof TypeError ? "네트워크 연결을 확인해 주세요." : "프로필을 만들지 못했습니다. 다시 시도해 주세요.";
      } finally {
        $("nameSubmit").disabled = false;
      }
    };
    form.addEventListener("submit", onSubmit);
    $("nameCancel").addEventListener("click", onCancel);
    dlg.addEventListener("close", onCancel);
    dlg.showModal();
    input.focus();
  });
}

function setStatus3(msg, error = false) {
  $("status3").className = error ? "error" : "";
  $("status3").style.marginTop = msg ? "4px" : "0";
  $("status3").textContent = msg;
}

async function loadSaved() {
  const box = $("saved");
  box.textContent = "";
  if (!profile) { setStatus3("프로필을 입력하면 저장한 레시피를 볼 수 있어요."); return; }
  setStatus3("불러오는 중입니다...");
  const owner = profile.id;
  try {
    const rows = await db(`recipes?profile_id=eq.${owner}&select=*&order=created_at.desc`);
    if (!profile || profile.id !== owner) return;   // 불러오는 사이 프로필이 바뀐 경우
    setStatus3(rows.length ? "" : "저장한 레시피가 없습니다.");
    rows.forEach((r) => box.appendChild(buildSavedItem(r)));
  } catch (e) {
    setStatus3(e instanceof TypeError ? "네트워크 연결을 확인해 주세요." : "레시피를 불러오지 못했습니다.", true);
  }
}

function buildSavedItem(r) {
  const item = el("details", null, "recipe");
  const sum = el("summary", r.title);
  sum.appendChild(el("small", new Date(r.created_at).toLocaleDateString("ko-KR")));
  item.appendChild(sum);
  fillRecipeBody(item, r);

  const actions = el("div", null, "actions");
  const del = el("button", "삭제", "secondary danger");
  del.addEventListener("click", async () => {
    if (!confirm(`'${r.title}' 레시피를 삭제할까요?`)) return;
    del.disabled = true;
    try {
      await db(`recipes?id=eq.${r.id}`, { method: "DELETE" });
      item.remove();
      if (!$("saved").children.length) setStatus3("저장한 레시피가 없습니다.");
    } catch {
      del.disabled = false;
      setStatus3("삭제하지 못했습니다. 다시 시도해 주세요.", true);
    }
  });
  actions.appendChild(del);
  item.appendChild(actions);
  return item;
}

async function saveRecipe(r, btn) {
  if (btn.dataset.saved) return;
  btn.disabled = true;
  try {
    if (!profile && !(await askProfile())) { btn.disabled = false; return; }
    await db("recipes", {
      method: "POST",
      body: {
        profile_id: profile.id, title: r.title, summary: r.summary,
        cook_time_min: r.cook_time_min, difficulty: r.difficulty,
        ingredients: r.ingredients, steps: r.steps,
      },
    });
    btn.dataset.saved = "1";
    btn.textContent = "저장됨";
    loadSaved();
  } catch (e) {
    btn.disabled = false;
    setStatus2(e instanceof TypeError ? "네트워크 연결을 확인해 주세요." : "저장하지 못했습니다. 다시 시도해 주세요.", { error: true });
  }
}

$("profileBtn").addEventListener("click", async () => {
  if (profile) {
    profile = null;
    storeProfile();
    renderProfileBar();
    await loadSaved();
    document.querySelectorAll("#recipes .actions button").forEach((b) => { delete b.dataset.saved; b.textContent = "저장"; b.disabled = false; });
  }
  if (await askProfile()) { await loadSaved(); }
});

loadStoredProfile();
renderProfileBar();
loadSaved();

async function recommend() {
  if (busy2 || !ingredients.length) return;
  busy2 = true;
  els.recommend.disabled = true;
  setStatus2("레시피를 만드는 중입니다...", { loading: true });
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 60000);
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/generate-recipes`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ingredients }),
      signal: ctrl.signal,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "레시피 생성에 실패했습니다.");
    renderRecipes(data.recipes || []);
    setStatus2("");
  } catch (e) {
    const msg = e.name === "AbortError" ? "응답이 너무 오래 걸립니다. 다시 시도해 주세요."
      : e instanceof TypeError ? "네트워크 연결을 확인해 주세요."
      : e.message;
    setStatus2(msg, { error: true });
  } finally {
    clearTimeout(timer);
    busy2 = false;
    els.recommend.disabled = ingredients.length === 0;
  }
}

els.recommend.addEventListener("click", recommend);
els.drop.addEventListener("click", () => els.file.click());
els.drop.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); els.file.click(); } });
els.file.addEventListener("change", () => { handleFile(els.file.files[0]); els.file.value = ""; });
["dragenter", "dragover"].forEach((t) => els.drop.addEventListener(t, (e) => { e.preventDefault(); els.drop.classList.add("over"); }));
["dragleave", "drop"].forEach((t) => els.drop.addEventListener(t, (e) => { e.preventDefault(); els.drop.classList.remove("over"); }));
els.drop.addEventListener("drop", (e) => handleFile(e.dataTransfer.files[0]));
els.detect.addEventListener("click", detect);
els.addForm.addEventListener("submit", (e) => {
  e.preventDefault();
  addIngredient(els.addInput.value);
  els.addInput.value = "";
});
</script>
</body>
</html>
