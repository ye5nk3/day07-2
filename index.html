<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>냉장고 레시피</title>
<style>
  :root {
    --bg: #fafaf7; --card: #fff; --text: #222; --muted: #6b6b6b;
    --line: #e2e2dc; --accent: #2f8f5b; --accent-text: #fff;
    --chip: #e8f4ed; --danger: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151816; --card: #1f2321; --text: #eee; --muted: #a0a6a2;
      --line: #333a36; --accent: #4cbb81; --accent-text: #0e1511;
      --chip: #24352b; --danger: #ff7b6b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    line-height: 1.5;
  }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.4rem; margin: 8px 0 16px; }
  h2 { font-size: 1.05rem; margin: 0 0 12px; }
  section {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px; margin-bottom: 16px;
  }
  button {
    font: inherit; border: 0; border-radius: 8px; padding: 10px 16px;
    background: var(--accent); color: var(--accent-text); cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--line); }
  #drop {
    border: 2px dashed var(--line); border-radius: 10px; padding: 24px 12px;
    text-align: center; color: var(--muted); cursor: pointer;
  }
  #drop.over { border-color: var(--accent); }
  #preview { display: none; width: 100%; max-height: 320px; object-fit: contain; border-radius: 8px; margin-top: 12px; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  .row input {
    flex: 1; min-width: 0; font: inherit; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text);
  }
  #chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; min-height: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 4px;
    background: var(--chip); border-radius: 999px; padding: 4px 6px 4px 12px;
  }
  .chip button {
    background: transparent; color: var(--muted); padding: 0 6px; font-size: 1.1rem; line-height: 1.4;
  }
  #status { margin-top: 12px; color: var(--muted); min-height: 1.5em; }
  #status.error { color: var(--danger); }
  .spinner {
    display: inline-block; width: 14px; height: 14px; margin-right: 6px; vertical-align: -2px;
    border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main>
  <h1>🧊 냉장고 레시피</h1>

  <section id="step1">
    <h2>① 사진 · 재료</h2>
    <div id="drop" tabindex="0" role="button" aria-label="냉장고 사진 선택">
      사진을 끌어다 놓거나 눌러서 선택하세요
    </div>
    <input id="file" type="file" accept="image/*" hidden>
    <img id="preview" alt="선택한 사진 미리보기">
    <div class="row">
      <button id="detect" disabled>재료 인식</button>
    </div>
    <div id="status" aria-live="polite"></div>

    <div id="chips" aria-label="인식된 재료"></div>
    <form class="row" id="addForm">
      <input id="addInput" maxlength="30" placeholder="재료 직접 추가" aria-label="재료 직접 추가">
      <button type="submit" class="secondary">추가</button>
    </form>
  </section>
</main>

<script>
// 공개 가능한 값만 둡니다 (service_role 키 금지).
const SUPABASE_URL = "https://bkebbwsfwcnrrhbkrtyt.supabase.co";
const MAX_INGREDIENTS = 40;
const MAX_SIDE = 1024;

const $ = (id) => document.getElementById(id);
const els = {
  drop: $("drop"), file: $("file"), preview: $("preview"), detect: $("detect"),
  status: $("status"), chips: $("chips"), addForm: $("addForm"), addInput: $("addInput"),
};

let imageData = null;      // 리사이즈된 data URL
let ingredients = [];      // 현재 재료 목록
let edited = false;        // 인식 이후 사용자가 직접 편집했는지
let busy = false;

function setStatus(msg, { error = false, loading = false } = {}) {
  els.status.className = error ? "error" : "";
  els.status.textContent = "";
  if (loading) {
    const sp = document.createElement("span");
    sp.className = "spinner";
    els.status.appendChild(sp);
  }
  els.status.appendChild(document.createTextNode(msg));
}

function renderChips() {
  els.chips.textContent = "";
  ingredients.forEach((name, i) => {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.appendChild(document.createTextNode(name));
    const x = document.createElement("button");
    x.type = "button";
    x.textContent = "✕";
    x.setAttribute("aria-label", name + " 삭제");
    x.addEventListener("click", () => {
      ingredients.splice(i, 1);
      edited = true;
      renderChips();
    });
    chip.appendChild(x);
    els.chips.appendChild(chip);
  });
}

function addIngredient(raw) {
  const name = raw.trim().replace(/\s+/g, " ");
  if (!name) return;
  if (ingredients.includes(name)) { setStatus("이미 있는 재료입니다.", { error: true }); return; }
  if (ingredients.length >= MAX_INGREDIENTS) { setStatus(`재료는 최대 ${MAX_INGREDIENTS}개까지 가능합니다.`, { error: true }); return; }
  ingredients.push(name);
  edited = true;
  setStatus("");
  renderChips();
}

function resizeToJpeg(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, MAX_SIDE / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
    img.src = url;
  });
}

async function handleFile(file) {
  if (!file || !file.type.startsWith("image/")) { setStatus("이미지 파일을 선택해 주세요.", { error: true }); return; }
  if (edited && !confirm("직접 편집한 재료 목록이 초기화됩니다. 계속할까요?")) return;
  try {
    imageData = await resizeToJpeg(file);
  } catch {
    setStatus("이미지를 읽지 못했습니다. 다른 사진을 선택해 주세요.", { error: true });
    return;
  }
  els.preview.src = imageData;
  els.preview.style.display = "block";
  ingredients = [];
  edited = false;
  renderChips();
  setStatus("");
  els.detect.disabled = false;
}

async function detect() {
  if (busy || !imageData) return;
  busy = true;
  els.detect.disabled = true;
  setStatus("재료를 인식하는 중입니다...", { loading: true });
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 60000);
  try {
    const res = await fetch(`${SUPABASE_URL}/functions/v1/detect-ingredients`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image: imageData }),
      signal: ctrl.signal,
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "재료 인식에 실패했습니다.");
    ingredients = data.ingredients || [];
    edited = false;
    renderChips();
    setStatus(ingredients.length
      ? `${ingredients.length}개 재료를 찾았습니다. 빼거나 더해 주세요.`
      : "재료를 찾지 못했어요. 직접 추가해 주세요.");
  } catch (e) {
    const msg = e.name === "AbortError" ? "응답이 너무 오래 걸립니다. 다시 시도해 주세요."
      : e instanceof TypeError ? "네트워크 연결을 확인해 주세요."
      : e.message;
    setStatus(msg, { error: true });
  } finally {
    clearTimeout(timer);
    busy = false;
    els.detect.disabled = !imageData;
  }
}

els.drop.addEventListener("click", () => els.file.click());
els.drop.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); els.file.click(); } });
els.file.addEventListener("change", () => { handleFile(els.file.files[0]); els.file.value = ""; });
["dragenter", "dragover"].forEach((t) => els.drop.addEventListener(t, (e) => { e.preventDefault(); els.drop.classList.add("over"); }));
["dragleave", "drop"].forEach((t) => els.drop.addEventListener(t, (e) => { e.preventDefault(); els.drop.classList.remove("over"); }));
els.drop.addEventListener("drop", (e) => handleFile(e.dataTransfer.files[0]));
els.detect.addEventListener("click", detect);
els.addForm.addEventListener("submit", (e) => {
  e.preventDefault();
  addIngredient(els.addInput.value);
  els.addInput.value = "";
});
</script>
</body>
</html>
